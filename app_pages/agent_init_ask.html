<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>

    <!-- 保持原有引用路径 -->
    <link rel="stylesheet" href="../font/fonts.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/gpt-base.css">
    <link rel="stylesheet" href="../css/base.css">

    <link rel="stylesheet" href="../css/agentMiniAsk.css">

</head>

<body>
    <div class="App">
        <div class="mini-questionnaire">
            <div class="q-header">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="step-text" id="step-text">1/2</span>
            </div>

            <!-- 问题1：听歌风格（多选） -->
            <div class="question-panel" id="panel-1">
                <h3 class="q-title">我们想知道... 你平时喜欢什么听歌风格？</h3>
                <div class="options-grid" id="style-options"></div>

                <div class="selected-info" id="selected-style-info">
                    已选择 <span id="style-count">0</span> 个
                </div>
            </div>

            <!-- 问题2：听歌场景（单选） -->
            <div class="question-panel" id="panel-2" style="display: none;">
                <h3 class="q-title">还有还有.. 你现在处于什么场景？</h3>
                <div class="options-grid" id="scene-options"></div>
                <div class="selected-info"></div> <!-- 占位，保持flex结构一致 -->
            </div>

            <!-- 底部按钮 (始终固定) -->
            <div class="q-footer">
                <button class="btn skip-btn" id="skip-btn">跳过</button>
                <button class="btn next-btn" id="next-btn">下一题</button>
                <button class="btn submit-btn" id="submit-btn" style="display: none;">提交</button>
            </div>
        </div>
    </div>

    <script src="../js/base.js"></script>
    <script src="../js/agent/miniAsk.js"></script>
</body>

</html>
