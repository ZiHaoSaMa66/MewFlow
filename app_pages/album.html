<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MewFlow - 主页</title>

    <link rel="stylesheet" href="../font/fonts.css">

    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/gpt-base.css">
    <link rel="stylesheet" href="../css/base.css">

    <link rel="stylesheet" href="../css/index.css">

    <link rel="stylesheet" href="../css/album.css">

<body>
    <div class="App">

        <main class="content">

            <div class="album-header">
                <img class="album-cover" src="../img/def_cover.png" alt="">
                <div class="album-infos">
                    <span>专辑</span>
                    <span class="album-title">titletitletitletitletitletitletitletitletitletitletitletitletitletitletitletitletitletitletitletitletitletitle</span>
                    <span class="album-artist">artist</span>
                </div>
            </div>

            <div class="album-tracks-list">

                <!-- <div class="album-tracks-line">碟片 0</div> -->

                <div class="album-tracks-item">
                    <div class="album-tracks-item-number">#1</div>
                    <img src="../img/def_cover.png" alt="">
                    <div class="album-tracks-item-duration">
                        
                        <div class="album-tracks-item-title">title</div>
                        <div class="album-tracks-item-artist">artist</div>

                    </div>

                    <span class="album-tracks-item-times">0:00</span>

                </div>

            </div>

            <!-- <div id="debug" style="font-size: 30px;"></div> -->

        </main>

    </div>

    <script src="../js/base.js"></script>

    <script src="../js/album.js"></script>

        init_album_list();

    </script>
