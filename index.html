<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MewFlow</title>

    <link rel="stylesheet" href="./font/fonts.css">

    <link rel="stylesheet" href="./css/theme.css">

    <link rel="stylesheet" href="./css/gpt-base.css">

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/notify.css">
    <link rel="stylesheet" href="./css/bigMusicPlayer.css">

    <link rel="stylesheet" href="./css/javaScriptInj.css">

    <link rel="stylesheet" href="./css/betterBg.css">

    <link rel="stylesheet" href="./css/blockOverPage.css">

    <link rel="stylesheet" href="./mobi-css/mob.base.css">
    <link rel="stylesheet" href="./mobi-css/mob-main.css">

    <link rel="icon" href="./favicon.ico">

</head>

<body>

    <div class="App">

        <div id="notification-container"></div>

        <header class="main-header">
            <h1 class="logo">MewFlow</h1>
            <nav class="nav-bar">
                <a onclick="navTo('./app_pages/index.html')">首页</a>
                <a onclick="navTo('./app_pages/library.html')">音乐库</a>
                <!-- <a onclick="openBlockOverPage('一起听', './app_pages/tgt_linsten.html')">一起听</a> -->
                <a onclick="navTo('./app_pages/playlist.html')">歌单列表</a>
                <a onclick="navTo('./app_pages/setting.html')">设置</a>
            </nav>
        </header>

        <div class="innerPage">
            <iframe id="mainIframe" src="./app_pages/login.html" frameborder="0" style="height: 100vh;"></iframe>
            <!-- <div id="iframeLoader">正在努力渲染喵...</div>  -->
            <div class="subIframeApp" id="subIframeApp" style="display: none;">
                <div class="subIframeApp_controlTab">
                    <span onclick="closeSubIframe()">❌</span>
                </div>
                <iframe id="subIframe" src="" frameborder="0" style="height: 100vh;"></iframe>
            </div>
        </div>


        <div class="musicPlayer">
            <audio crossorigin="anonymous" src="" id="musicPlayerAudio"></audio>

            <div class="musicPlayer_big_info">

                <div class="musicPlayer_cover_class">

                    <img class="musicPlayer_cover" src="../img/def_cover.png" alt="">
                </div>

                <div class="musicPlayer_info">
                    <span class="musicPlayer_title">Title</span>
                    <span class="musicPlayer_artist">Art</span>
                </div>

            </div>


            <div class="musicPlayer_progress">
                <span class="progress_time current_time">0:00</span>
                <div class="progress_bar">
                    <div class="progress_bar_fill"></div>
                    <div class="progress_bar_flow_loaded"></div>
                </div>
                <span class="progress_time total_time">0:00</span>
            </div>

            <div class="musicPlayer_controls">
                <div onclick="prevMusic()">⏮️</div>
                <div class="audio_plays_btn" onclick="togglePlayMusic()">⏯️</div>
                <div onclick="nextMusic()">⏭️</div>
                <div onclick="switch_play_que_mode()" class="que_mode_btn">🔁</div>
                <div onclick="show_big_music_queue_ui()">#️⃣</div>

            </div>

        </div>

        <div class="blockOverPage">
            <div class="blockOverPage_top">
                <span class="blockOverPage_title"></span>
                <span class="blockOverPage_close" onclick="closeBlockOverPage()">❌</span>
            </div>
            <iframe id="blockOverIframe" src="./app_pages/tgt_linsten.html" frameborder="0"></iframe>
        </div>

        <div class="bigMusicOverPage">
            <div class="bmBackGroundCover"></div>

            <div class="bigMusicTopBar">
                <span class="hideOverPage" onclick="hideBigMusicUi()">🔽</span>
                <span class="bMc_topBar_title">歌曲</span>
                <span class="bMc_topBar_lyric">歌词</span>
            </div>

            <div class="bigMusicOverPageScroll">

                <div class="bigMusicOverPage_innerScroll">

                    <div class="bigMusicPlayer_cover_class">



                        <div class="bigMusicPlayer_cover_up_class">
                            <img class="bigMusicPlayer_cover" src="../img/def_cover.png" alt="">
                        </div>

                        <div class="bigMusicPlayer_infos">

                            <div class="musicInfo">
                                <span class="musicInfo_title">UnLoaded</span>
                                <span class="musicInfo_artist">Artist</span>
                            </div>

                            <div class="bigMusicProgress musicPlayer_progress">
                                <span class="bigMusicProgress_current_time progress_time current_time">0:00</span>
                                <div class="bigMusic_progress_bar progress_bar">
                                    <div class="bigMusic_progress_bar_fill progress_bar_fill"></div>
                                    <div class="bigMusic_progress_bar_flow_loaded progress_bar_flow_loaded"></div>
                                </div>
                                <span class="bigMusic_progress_all_time progress_time total_time">0:00</span>
                            </div>



                            <div class="bigMusic_controls">
                                <div onclick="switch_play_que_mode()" class="que_mode_btn">🔁</div>
                                <div onclick="prevMusic()">⏮️</div>
                                <div class="audio_plays_btn" onclick="togglePlayMusic()">⏯️</div>
                                <div onclick="nextMusic()">⏭️</div>
                                <div onclick="show_big_music_queue_ui()">#️⃣</div>


                            </div>
                        </div>


                    </div>

                    <div class="bigMusic_lyrics">
                        <div class="lyrics-container">
                            <div class="lyrics" id="lyrics">
                                <!-- 歌词将被动态插入 -->
                            </div>
                        </div>

                        <canvas id="visualizer"
                            style="position: absolute; top: 0; left: 0;width: 100%; height: 100%; z-index: -1;"></canvas>

                    </div>
                </div>
            </div>




        </div>


        <div class="bigMusic_queue_ui">
            <div class="bigMusic_queue_title">
                <span class="pointer" onclick="hide_big_music_queue_ui()">❌</span>
                <span>播放列表</span>
                <span class="pointer" onclick="remove_all_songs_from_queue()">清空全部</span>
            </div>
            <div class="bigMusic_queue_list">
                <div class="queue_item">

                    <span class="queue_item_no">#1</span>

                    <div class="queue_item_cover">
                        <div class="queue_item_cover_2">
                            <img class="queue_item_cover_img" src="../img/def_cover.png" alt="">
                        </div>
                    </div>
                    <div class="queue_item_info">
                        <span class="queue_item_title">1234567</span>
                        <span class="queue_item_artist">123</span>
                    </div>
                    <span>0:00</span>
                    <span>⏫</span>
                    <span>❌</span>
                </div>
            </div>
        </div>

    </div>

    </div>


    </div>

</body>
<script src="./js/base.js"></script>
<script src="./js/cy-min.js"></script>
<script src="./js/navidromeAPI.js"></script>
<script src="./js/musicVisualization.js"></script>
<script src="./js/betterPlayColor.js"></script>
<script src="./js/lyrics.js"></script>

<script src="./js/main.js"></script>
<script src="./js/mainSubPage.js"></script>
<script src="./js/announcement.js"></script>


<script>
    init();
</script>

</html>
